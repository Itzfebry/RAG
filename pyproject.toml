# Project: RAG — Personal AI Agent (FastAPI + Supabase + Next.js frontend)
#
# Python tooling configuration. Frontend tooling lives in package.json.
# Lint:      python -m ruff check .
# Format:    python -m ruff format --check .

# Runtime dependencies for the Vercel Python runtime (serverless functions in api/).
# Kept in sync with requirements.txt (~= X.Y.Z on pip === ">= X.Y.Z, < X.Y+1").
[project]
name = "rag"
version = "1.0.0"
description = "Personal AI Agent powered by LangChain, customized with owner-specific knowledge."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2,<0.143",
    "uvicorn>=0.54.0,<0.55",
    "pydantic>=2.13.5,<2.14",
    "pydantic-settings>=2.15.0,<2.16",
    "langchain-text-splitters>=1.1.2,<1.2",
    "supabase>=2.32.0,<2.33",
    "pyjwt>=2.15.1,<2.16",
    "bcrypt>=5.0.0,<5.1",
    "python-multipart>=0.0.32,<0.0.33",
    "openai>=3.24.0,<3.25",
    "python-dotenv>=1.2.4,<1.3",
    "langchain-nvidia-ai-endpoints>=1.4.3,<1.5",
    "httpx>=0.28.1,<0.29",
    "pypdf>=6.21.1,<6.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

# Exclude third-party / generated / vendored code.
extend-exclude = [
    "node_modules",
    ".next",
    ".venv",
    "venv",
    ".claude",
    "data",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, f-strings)
    "I",   # isort (import ordering)
    "B",   # bugbear (likely bugs: bare except, shadowed vars, mutable defaults)
    "UP",  # pyupgrade (modernize to py311 idioms)
    "SIM", # simplify (needless else, redundant code)
    "C4",  # comprehensions
    "RUF", # ruff-specific
]

ignore = [
    "E501",  # line too long — formatter territory; long URLs/configs are OK
    "B008",  # function call in argument default — FastAPI's Depends() idiom requires it
    "B904",  # raise-without-from — too invasive for an incremental adoption
    "SIM117",# nested with — contextlib.suppress refactor batchestr to Phase 2
]

[tool.ruff.lint.per-file-ignores]
# Tests: allow asserts and loose style habits.
"backend/tests/*" = ["S101", "F841"]
# Legacy tool scripts — cleaned up in Phase 2, not blocking.
"backend/tools/*" = ["E722"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
configure_thread_native = false

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "backend/tools/*"]
